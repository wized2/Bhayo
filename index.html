  .profile { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; overscroll-behavior: contain; transform: translateX(100%); visibility: hidden; transition: transform .45s var(--ease), visibility 0s .45s; }

  .p-bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 14px; padding: calc(12px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 12px max(16px, env(safe-area-inset-left)); backdrop-filter: blur(18px) saturate(1.4); -webkit-backdrop-filter: blur(18px) saturate(1.4); background: color-mix(in srgb, var(--bg) 80%, transparent); border-bottom: 1px solid var(--line); }

  <main class="wrap">

<div class="profile" id="profile" role="dialog" aria-modal="true" aria-labelledby="pTitle" aria-hidden="true">
  <div class="p-bar">
    <button class="icon-btn" id="backBtn" aria-label="Back"><span class="icon">arrow_back</span></button>

</div>

<div class="pill" id="pill" role="status" aria-live="polite"><span class="icon">cloud_off</span><span id="pillText">Offline · showing saved copy</span></div>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer" aria-hidden="true">

  </div>
  <div class="lb-dots" id="lbDots" aria-hidden="true"></div>
</div>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------ data */
  var MEMBERS = [
    { id: 'majid', name: 'Majid', role: 'Saljook.Editiz', image: 'img/majid.jpg', age: '24', birthday: '2002', occupation: 'Useless', email: 'km6483723@gmail.com', phone: '+923073476034', location: 'Taj Garh, Rahim Yar Khan', bio: 'Majid is a boy who use phone all day and watch movies and TikTok, work on a hotel at night.', hobbies: ['Cooking', 'Browsing', 'Scrolling'],
      gallery: [
        { src: 'photos/majid/1.jpg', file: 'IMG_20261015.jpg' },
        { src: 'photos/majid/2.jpg', file: 'IMG_20261019.jpg' },

    { id: 'ajmal', name: 'Ajmal Bhayo', role: 'Khalifa Electric', image: 'img/ajmal.jpg', age: '20-25', birthday: 'N/A', occupation: 'Electric Engineer', email: 'N/A', phone: '+92 341 3293399', location: 'Taj Garh, Rahim Yar Khan', bio: 'Ajmal is a disciplined young man who runs his own electrical shop. He is a master of electrical engineering.', hobbies: ['Work', 'Scrolling', 'TikTok'], gallery: [] },
    { id: 'mubeen', name: 'Mubeen Bhayo', role: '😎😎😎', image: 'img/mubeen.jpg', age: '20-25', birthday: 'N/A', occupation: 'Work', email: 'N/A', phone: '+92 309 7469561', bio: "Mubeen is a strong boy, always busy in work, Majid's best friend", hobbies: ['Work', 'Gaming', 'Music'],
      gallery: [
        { src: 'photos/mubeen/1.jpg', file: 'IMG_20240412_082536.jpg' },
        { src: 'photos/mubeen/2.jpg' },
        { src: 'photos/mubeen/3.jpg', file: 'IMG_20250607_211620.jpg' },

      gallery: [
        { src: 'photos/umar/1.jpg' },
        { src: 'photos/umar/2.jpg', file: 'IMG_20250905_140644.jpg' },
        { src: 'photos/umar/3.jpg', file: 'IMG-20260321-WA0051.jpg' },
        { src: 'photos/umar/4.jpg' },
        { src: 'photos/umar/5.jpg' },
        { src: 'photos/umar/6.jpg', file: 'IMG_20250905_140717.jpg' }
      ] }
  ];

  /* ---------------------------------------------------------------- helpers */
  var $ = function (id) { return document.getElementById(id); };
  var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function has(v) { return v && v !== 'N/A'; }
  function digits(s) { return String(s).replace(/\D/g, ''); }
  function initial(n) { return esc(String(n).trim().charAt(0).toUpperCase()); }
  function shotDate(file) {
    var m = /(20\d{2})(\d{2})(\d{2})/.exec(file || '');
    if (!m) return '';
    var mo = +m[2], d = +m[3];
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return '';
    return d + ' ' + MONTHS[mo - 1] + ' ' + m[1];
  }
  function firstName(m) { return m.name.split(' ')[0]; }
  function photoCount() { return MEMBERS.reduce(function (n, m) { return n + m.gallery.length; }, 0); }
  function byId(id) { for (var i = 0; i < MEMBERS.length; i++) if (MEMBERS[i].id === id) return MEMBERS[i]; return null; }
  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  /* ------------------------------------------------------------------- home */
  var query = '';
  function filtered() {
    var q = query.toLowerCase().trim();
    if (!q) return MEMBERS;
    return MEMBERS.filter(function (m) {
      return [m.name, m.role, m.bio, m.occupation, m.location].concat(m.hobbies).join(' ').toLowerCase().indexOf(q) !== -1;
    });
  }

  function renderStats() {
    $('stats').innerHTML =
      '<span class="stat"><span class="icon">groups</span><b>' + MEMBERS.length + '</b> members</span>' +
      '<span class="stat"><span class="icon">photo_library</span><b>' + photoCount() + '</b> photos</span>' +
      '<span class="stat"><span class="icon">location_on</span>Rahim Yar Khan</span>';
  }

  function renderGrid() {
    var list = filtered(), grid = $('grid');
    $('count').textContent = list.length ? (query ? list.length + ' of ' + MEMBERS.length + ' members' : '') : '';
    if (!list.length) {
      grid.innerHTML = '<div class="empty"><span class="icon">search_off</span>No members match “' + esc(query) + '”</div>';
      return;
    }
    grid.innerHTML = list.map(function (m, i) {
      var bio = m.bio ? esc(m.bio) : '';
      return '<button class="card" data-id="' + m.id + '" style="animation-delay:' + (i * 60) + 'ms" aria-label="Open ' + esc(m.name) + ' profile">' +
        '<span class="avatar"><img src="' + esc(m.image) + '" alt="" loading="lazy" decoding="async" onerror="this.replaceWith(document.createTextNode(\'' + initial(m.name) + '\'))"></span>' +
        '<span class="card-body"><span class="card-name">' + esc(m.name) + '</span><br>' +
        '<span class="role">' + esc(m.role || 'Member') + '</span>' +
        (bio ? '<span class="card-bio" style="display:-webkit-box">' + bio + '</span>' : '') + '</span>' +
        '<span class="card-end">' + (m.gallery.length ? '<span class="photo-pill"><span class="icon">photo_library</span>' + m.gallery.length + '</span>' : '') +
        '<span class="icon">chevron_right</span></span></button>';
    }).join('');
  }

  $('grid').addEventListener('click', function (e) {
    var b = e.target.closest('.card');
    if (b) openProfile(b.getAttribute('data-id'), true);
  });

  /* search */
  function openSearch() { $('search').classList.add('open'); $('searchBtn').style.display = 'none'; setTimeout(function () { $('searchInput').focus(); }, 60); }
  function closeSearch() { $('search').classList.remove('open'); $('searchBtn').style.display = ''; $('searchInput').value = ''; query = ''; renderGrid(); }
  $('searchBtn').addEventListener('click', openSearch);
  $('searchClose').addEventListener('click', closeSearch);
  $('searchInput').addEventListener('input', function (e) { query = e.target.value; renderGrid(); });
  $('searchInput').addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSearch(); });

  /* topbar shadow */
  window.addEventListener('scroll', function () { $('topbar').classList.toggle('scrolled', window.scrollY > 8); }, { passive: true });

  /* theme: light -> dark -> system */
  function applyTheme(t) {
    var r = document.documentElement;
    if (t === 'light' || t === 'dark') r.setAttribute('data-theme', t); else r.removeAttribute('data-theme');
    store('theme', t === 'light' || t === 'dark' ? t : null);
    $('themeIcon').textContent = t === 'light' ? 'light_mode' : t === 'dark' ? 'dark_mode' : 'brightness_auto';
    $('themeBtn').setAttribute('aria-label', 'Theme: ' + (t === 'light' || t === 'dark' ? t : 'system') + '. Tap to change');
  }
  function theme() { var t = load('theme'); return t === 'light' || t === 'dark' ? t : 'system'; }
  $('themeBtn').addEventListener('click', function () { var t = theme(); applyTheme(t === 'light' ? 'dark' : t === 'dark' ? 'system' : 'light'); });
  applyTheme(theme());

  /* ---------------------------------------------------------------- profile */
  var current = null;
  var lastFocus = null;

  function tile(icon, label, value, href) {
    var v = href ? '<a href="' + esc(href) + '" class="tile-v">' + esc(value) + '</a>' : '<div class="tile-v">' + esc(value) + '</div>';
    return '<div class="tile"><span class="icon" aria-hidden="true">' + icon + '</span><div style="min-width:0"><div class="tile-l">' + label + '</div>' + v + '</div></div>';
  }

  function renderProfile(m) {
    var tiles = '';
    if (has(m.age)) tiles += tile('cake', 'Age', m.age);
    if (has(m.occupation)) tiles += tile('work', 'Occupation', m.occupation);
    if (has(m.phone)) tiles += tile('call', 'Phone', m.phone, 'tel:+' + digits(m.phone));
    if (has(m.email)) tiles += tile('mail', 'Email', m.email, 'mailto:' + m.email);
    if (has(m.location)) tiles += tile('location_on', 'Location', m.location);
    if (has(m.birthday)) tiles += tile('celebration', 'Born', m.birthday);

    var acts = '';
    if (has(m.phone)) {
      acts += '<a class="act main" href="tel:+' + digits(m.phone) + '"><span class="icon">call</span>Call</a>';
      acts += '<a class="act" href="https://wa.me/' + digits(m.phone) + '" target="_blank" rel="noopener"><span class="icon">chat</span>WhatsApp</a>';
    }
    if (has(m.email)) acts += '<a class="act" href="mailto:' + esc(m.email) + '"><span class="icon">mail</span>Email</a>';

    var gal;
    if (m.gallery.length) {
      gal = '<div class="gallery" id="gallery">' + m.gallery.map(function (g, i) {
        var d = shotDate(g.file);
        return '<button class="shot loading" data-i="' + i + '" style="animation-delay:' + Math.min(i, 8) * 50 + 'ms" aria-label="Open photo ' + (i + 1) + ' of ' + m.gallery.length + (d ? ', ' + d : '') + '">' +
          '<img src="' + esc(g.src) + '" alt="' + esc(firstName(m)) + (d ? ', ' + d : ', photo ' + (i + 1)) + '" loading="lazy" decoding="async" referrerpolicy="no-referrer">' +
          (d ? '<span class="cap">' + d + '</span>' : '') + '</button>';
      }).join('') + '</div>';
    } else {
      gal = '<div class="gal-empty">No photos added yet.</div>';
    }

    $('pTitle').textContent = m.name;
    $('pBody').innerHTML =
      '<div class="p-hero" style="--cover:url(\'' + esc(m.image) + '\')">' +
        '<div class="p-photo"><img src="' + esc(m.image) + '" alt="' + esc(m.name) + '" onerror="this.replaceWith(document.createTextNode(\'' + initial(m.name) + '\'))"></div>' +
        '<h3>' + esc(m.name) + '</h3><span class="role">' + esc(m.role || 'Team member') + '</span>' +
        (acts ? '<div class="actions">' + acts + '</div>' : '') + '</div>' +
      (m.bio ? '<section class="section"><div class="section-h"><h4><span class="icon">person</span>About</h4></div><div class="bio">' + esc(m.bio) + '</div></section>' : '') +
      (tiles ? '<section class="section"><div class="section-h"><h4><span class="icon">badge</span>Details</h4></div><div class="tiles">' + tiles + '</div></section>' : '') +
      (m.hobbies.length ? '<section class="section"><div class="section-h"><h4><span class="icon">interests</span>Interests</h4></div><div class="chips">' + m.hobbies.map(function (h) { return '<span class="chip">' + esc(h) + '</span>'; }).join('') + '</div></section>' : '') +
      '<section class="section"><div class="section-h"><h4><span class="icon">photo_library</span>Gallery</h4>' + (m.gallery.length ? '<span class="n">' + m.gallery.length + ' photos</span>' : '') + '</div>' + gal + '</section>';

    /* shimmer until each photo is in, then reveal at its natural shape */
    var shots = $('pBody').querySelectorAll('.shot');
    Array.prototype.forEach.call(shots, function (s) {
      var img = s.querySelector('img');
      function ok() { s.classList.remove('loading'); s.classList.add('ready'); }
      function bad() { s.classList.remove('loading'); s.classList.add('failed'); s.insertAdjacentHTML('beforeend', '<span>Photo unavailable</span>'); }
      if (img.complete && img.naturalWidth) ok(); else if (img.complete) bad();
      else { img.addEventListener('load', ok, { once: true }); img.addEventListener('error', bad, { once: true }); }
    });
  }

  function openProfile(id, push) {
    var m = byId(id);
    if (!m) return;
    current = m;
    lastFocus = document.activeElement;
    renderProfile(m);
    var p = $('profile');
    p.scrollTop = 0;
    p.classList.add('open');
    p.setAttribute('aria-hidden', 'false');
    document.body.classList.add('no-scroll');
    if (push) { try { history.pushState({ p: id }, '', '#' + id); } catch (e) {} }
    setTimeout(function () { $('backBtn').focus({ preventScroll: true }); }, 60);
  }

  function hideProfile() {
    $('profile').classList.remove('open');
    $('profile').setAttribute('aria-hidden', 'true');
    document.body.classList.remove('no-scroll');
    current = null;
    if (lastFocus && lastFocus.focus) { try { lastFocus.focus({ preventScroll: true }); } catch (e) {} }
  }

  function closeProfile() {
    if (history.state && history.state.p) history.back(); else { hideProfile(); try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
  }

  $('backBtn').addEventListener('click', closeProfile);
  window.addEventListener('popstate', function () {
    if (lb.open) closeLb(true);
    var id = (location.hash || '').replace('#', '');
    if (id && byId(id)) { if (!current || current.id !== id) openProfile(id, false); } else if (current) hideProfile();
  });

  $('pBody').addEventListener('click', function (e) {
    var s = e.target.closest('.shot');
    if (s && current) openLb(current, +s.getAttribute('data-i'));
  });

  /* --------------------------------------------------------------- lightbox */
  var lb = { open: false, m: null, i: 0, x0: 0, y0: 0, tracking: false };
  var imgEl = $('lbImg');

  function dots() {
    $('lbDots').innerHTML = lb.m.gallery.map(function (_, i) { return '<span class="lb-dot' + (i === lb.i ? ' on' : '') + '"></span>'; }).join('');
  }
  function preload(i) {
    var g = lb.m.gallery[(i + lb.m.gallery.length) % lb.m.gallery.length];
    if (g) { var im = new Image(); im.referrerPolicy = 'no-referrer'; im.src = g.src; }
  }
  function show(i, dir) {
    var n = lb.m.gallery.length;
    lb.i = (i + n) % n;
    var g = lb.m.gallery[lb.i], d = shotDate(g.file);
    var root = $('lb');
    root.classList.add('busy');
    imgEl.classList.add('swap');
    var token = {};
    show.token = token;
    var tmp = new Image();
    tmp.referrerPolicy = 'no-referrer';
    function done() {
      if (show.token !== token) return;
      imgEl.src = g.src;
      imgEl.alt = firstName(lb.m) + (d ? ', ' + d : ', photo ' + (lb.i + 1));
      requestAnimationFrame(function () { imgEl.classList.remove('swap'); root.classList.remove('busy'); });
    }
    tmp.onload = done; tmp.onerror = done;
    tmp.src = g.src;
    $('lbTitle').textContent = lb.m.name;
    $('lbSub').textContent = (lb.i + 1) + ' / ' + n + (d ? '  ·  ' + d : '');
    $('lbOpen').href = g.page || g.src;
    $('lbPrev').hidden = $('lbNext').hidden = n < 2;
    dots();
    if (n > 1) { preload(lb.i + 1); preload(lb.i - 1); }
  }
  function openLb(m, i) {
    lb.open = true; lb.m = m;
    var root = $('lb');
    root.classList.add('open'); root.setAttribute('aria-hidden', 'false');
    show(i);
    $('lbClose').focus({ preventScroll: true });
  }
  function closeLb() {
    lb.open = false;
    $('lb').classList.remove('open'); $('lb').setAttribute('aria-hidden', 'true');
    imgEl.removeAttribute('src');
    show.token = null;
  }
  $('lbClose').addEventListener('click', closeLb);
  $('lbPrev').addEventListener('click', function (e) { e.stopPropagation(); show(lb.i - 1); });
  $('lbNext').addEventListener('click', function (e) { e.stopPropagation(); show(lb.i + 1); });
  $('lbStage').addEventListener('click', function (e) { if (e.target === $('lbStage')) closeLb(); });

  /* swipe: left/right to browse, down to close */
  var stage = $('lbStage');
  stage.addEventListener('touchstart', function (e) { if (e.touches.length !== 1) { lb.tracking = false; return; } lb.tracking = true; lb.x0 = e.touches[0].clientX; lb.y0 = e.touches[0].clientY; }, { passive: true });
  stage.addEventListener('touchend', function (e) {
    if (!lb.tracking) return;
    lb.tracking = false;
    var t = e.changedTouches[0], dx = t.clientX - lb.x0, dy = t.clientY - lb.y0;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) show(lb.i + (dx < 0 ? 1 : -1));
    else if (dy > 90 && Math.abs(dy) > Math.abs(dx) * 1.4) closeLb();
  }, { passive: true });

  document.addEventListener('keydown', function (e) {
    if (lb.open) {
      if (e.key === 'Escape') closeLb();
      else if (e.key === 'ArrowRight') show(lb.i + 1);
      else if (e.key === 'ArrowLeft') show(lb.i - 1);
      else if (e.key === 'Tab') { var f = $('lb').querySelectorAll('button:not([hidden]), a[href]'); if (f.length) { var first = f[0], last = f[f.length - 1]; if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } } }
      return;
    }
    if (e.key === 'Escape' && current) closeProfile();
  });

  /* show icon glyphs only once the icon font is in (no stray ligature words) */
  try {
    var ready = function () { document.documentElement.classList.add('icons-ready'); };
    if (document.fonts && document.fonts.load) document.fonts.load('24px "Material Symbols Rounded"', 'search').then(function (f) { if (f && f.length) ready(); });
  } catch (e) {}

  /* --------------------------------------------------------- offline / install */
  var pill = $('pill'), pillTimer;
  function flash(msg, ms) {
    $('pillText').textContent = msg; pill.classList.add('show');
    clearTimeout(pillTimer); if (ms) pillTimer = setTimeout(function () { pill.classList.remove('show'); }, ms);
  }
  window.addEventListener('offline', function () { flash('Offline · showing saved copy', 0); });
  window.addEventListener('online', function () { flash('Back online', 2200); });
  if (navigator.onLine === false) flash('Offline · showing saved copy', 4000);

  var deferred = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferred = e; $('installBtn').hidden = false; });
  window.addEventListener('appinstalled', function () { deferred = null; $('installBtn').hidden = true; flash('Installed', 2200); });
  $('installBtn').addEventListener('click', function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; $('installBtn').hidden = true; });
  });

  /* service worker: offline support, and photos are saved once then only re-checked */
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        var conn = navigator.connection || {};
        if (conn.saveData) return;
        var urls = [];
        MEMBERS.forEach(function (m) { m.gallery.forEach(function (g) { if (!/^https?:/.test(g.src)) urls.push(g.src); }); });
        function warm() { var w = reg.active || navigator.serviceWorker.controller; if (w) w.postMessage({ type: 'warm', urls: urls }); }
        navigator.serviceWorker.ready.then(function () { setTimeout(warm, 2500); });
      }).catch(function () {});
    });
  }

  /* ------------------------------------------------------------------ start */
  renderStats();
  renderGrid();
  var start = (location.hash || '').replace('#', '');
  if (start && byId(start)) openProfile(start, false);
})();
</script>
